name: 检查上游新版本

# 只检查上游有没有发布新的 Release；有新 tag 才触发 build.yml。
# 不再跟随 main 分支的每一次提交，也不再每日无条件构建。
on:
  schedule:
    - cron: '23 */6 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    name: 对比上游 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 取上游最新 Release
        id: release
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL --max-time 30 \
            https://api.github.com/repos/NousResearch/hermes-agent/releases/latest \
            | python3 -c 'import json,sys;print(json.load(sys.stdin).get("tag_name",""))')"
          case "${TAG}" in
            v[0-9]*) ;;
            *) echo "::error::无法解析上游 Release tag: '${TAG}'"; exit 1 ;;
          esac
          RECORDED="$(cat .upstream-release 2>/dev/null || true)"
          echo "上游最新 Release: ${TAG}"
          echo "已构建 Release: ${RECORDED:-<无>}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${TAG}" = "${RECORDED}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发构建
        if: steps.release.outputs.changed == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          REPO_FULL="${GITHUB_REPOSITORY:-}"
          OWNER="${REPO_FULL%%/*}"
          REPO_NAME="${REPO_FULL##*/}"

          if [ -n "${GITEA_TOKEN}" ]; then
            echo ">>> Gitea：触发 build.yml（upstream_ref=${TAG}）"
            API="${GITHUB_API_URL:-https://<gitea-host>/api/v1}"
            BODY="$(python3 -c 'import json,os;print(json.dumps({"ref":"main","inputs":{"upstream_ref":os.environ["TAG"]}}))')"
            curl -fsS -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              -X POST "${API}/repos/${OWNER}/${REPO_NAME}/actions/workflows/build.yml/dispatches" \
              -d "${BODY}" >/dev/null
            echo "已触发"
          else
            echo ">>> GitHub：触发 build.yml（upstream_ref=${TAG}）"
            gh workflow run build.yml --ref main -f "upstream_ref=${TAG}"
          fi
