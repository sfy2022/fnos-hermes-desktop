name: 检查上游更新

# 轻量任务：只查上游有没有新提交，有才触发完整构建。
# 与 build.yml 的每日构建互补——这个能更快反映上游变化。
on:
  schedule:
    - cron: '23 */6 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 对比上游 commit
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.sha }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 取上游最新 commit
        id: compare
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | cut -f1)
          echo "上游最新 commit: ${REMOTE_SHA}"

          # 记录上次构建用的上游 commit
          if [ -f .upstream-sha ]; then
            KNOWN=$(cat .upstream-sha)
          else
            KNOWN=""
          fi
          echo "上次构建 commit: ${KNOWN:-<无>}"

          if [ -n "${KNOWN}" ] && [ "${KNOWN}" = "${REMOTE_SHA}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${REMOTE_SHA}" >> "$GITHUB_OUTPUT"

      - name: 触发构建
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main'
            })
            core.info('已触发 build.yml')

  record:
    name: 记录本次 commit
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 写入 .upstream-sha
        uses: actions/checkout@v4
        with:
          ref: main
      - name: 提交
        run: |
          echo "${{ needs.check.outputs.upstream_sha }}" > .upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream-sha
          git commit -m "chore: 记录上游 commit ${{ needs.check.outputs.upstream_sha }}" || echo "无变更"
          git push || echo "推送失败（下次重试）"
