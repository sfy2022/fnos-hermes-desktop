name: trigger-release-0226

# 临时工作流：用 Actions 自己的 GITHUB_TOKEN 触发 build.yml，
# 强制构建并发布官方 v0.22.6。发布完成后删除本文件。

on:
  push:
    paths:
      - '.github/workflows/trigger-release-0226.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref main \
            -f upstream_ref=v0.22.6 \
            -F force=true
          echo "dispatched"
