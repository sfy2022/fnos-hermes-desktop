name: open-pr

# 临时 workflow：本地 GitHub token 只有只读权限，借用 Actions 的 GITHUB_TOKEN
# 为 refactor/embedded-gateway 创建 PR。PR 创建后本文件会在后续 commit 删除。

on:
  push:
    branches:
      - refactor/embedded-gateway

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    if: github.repository == 'sfy2022/fnos-hermes-desktop'
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head refactor/embedded-gateway --base main --state open --json number --jq 'length')"
          if [ "${existing}" != "0" ]; then
            echo "PR already open (#${existing})"
            exit 0
          fi
          gh pr create \
            --base main \
            --head refactor/embedded-gateway \
            --title "refactor: thin fnOS gateway adapter (fix iframe CSP) + official FPK layout" \
            --body "$(cat <<'EOF'
## 概要

修复 fnOS 桌面内嵌打不开的问题，并按飞牛官方规范重整 FPK 包结构与运行期 `etc/var/home` 布局。

### 根因
上游 Webapp 响应头带 `Content-Security-Policy: … frame-ancestors 'none'`
（v0.22.12 所用 commit `8d91e48e` 的 `hermes_cli/webapp_page_policy.py`），
浏览器拒绝任何 iframe；旧适配层还改写 HTML/注入内联 bridge，会破坏同一 CSP 的
sha256 白名单，导致白屏。

### 方案
- 新增 `packaging/fpk/app/runtime/gateway/gateway_adapter.py`（薄适配层）：
  - 剥网关前缀，注入 `X-Forwarded-Prefix`（由上游原生处理资源/路由/登录/Cookie Path）；
  - WebSocket 单路径透传；HTTP 流式转发（SSE/大文件不缓冲）；
  - **响应体零改写**，仅把 CSP `frame-ancestors 'none'` 改为 `'self'`、
    `X-Frame-Options: DENY` 改为 `SAMEORIGIN`；
  - 健康端点 `/.gateway-health`。
- 删除 `cmd/gateway_proxy.py`、`cmd/fnos_bridge.py`；运行期辅助移到 `app/runtime/`。
- 目录/字段规范化：`platform=x86`、移除未文档化 `micro_app`、`config/resource` → `{}`；
  `etc/` 配置、`var/` 运行数据、`home/` HOME；安装/升级迁移并清理旧适配器副本。
- 新增 `scripts/check_fpk_layout.py`、`scripts/check_gateway_contract.py`，
  接入 `build.sh` 与 CI；新增 52 个单测/集成测试。
- 文档：`docs/APP-STRUCTURE.md`、`docs/EMBEDDING.md`；更新 scripts README/smoke。

### 验证
- 本地 Windows：52 tests OK（12 个 AF_UNIX 用例 skip）。
- e5 真机 Linux：52 tests OK（全量，含 AF_UNIX / WS / SSE）。
- e5 真机安装重构包后：
  - 直连 `:9120` 登录后 200，CSP 仍为 `frame-ancestors 'none'`；
  - 适配层 socket 登录后 200，CSP 为 `frame-ancestors 'self'`，其余指令/哈希不变；
  - 经适配层登录返回 `next=/app/hermes-desktop/`，Cookie `Path=/app/hermes-desktop`；
  - 经适配层取 socket ticket 后 WebSocket 握手 **101**。
- 真机发现并修复：fnOS 下 `var/config.yaml` 相对符号链接目标错误；
  首装 venv 未就绪导致 basic_auth 回退 `127.0.0.1`（已加运行期补写）。

### 未验证
- 浏览器中飞牛桌面 iframe 的实际视觉渲染（e5 无浏览器；CSP/登录/WS 已由脚本验证）。
- `:5666` 真实网关需飞牛登录态；`appcenter-cli` 不支持 CLI 升级，升级/卸载路径待 Web UI 验收。

### 说明
默认不合入 main、不发 Release。
EOF
)"
