name: 同步上游并构建

# 触发条件：
#   - schedule    每日同步上游并构建
#   - workflow_dispatch  手动触发（可指定上游 ref）
#   - push        打包脚本变更时立即验证构建
on:
  schedule:
    - cron: '17 3 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（分支或 tag，留空用 main）'
        required: false
        default: 'main'
      skip_bundle:
        description: '跳过渲染层构建（复用缓存）'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: fnos-hermes-desktop-build
  cancel-in-progress: false

jobs:
  build:
    name: 构建 fpk
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      # 直接下载 Node 26 二进制，不依赖 setup-node——
      # Gitea 的 action 源与 GitHub 不完全一致，且 Node 26 较新，
      # setup-node 的版本清单可能尚未收录。直接装最稳。
      - name: 安装 Node.js 26
        run: |
          set -euo pipefail
          NODE_VER="v26.13.0"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64)  NODE_ARCH="x64" ;;
            aarch64) NODE_ARCH="arm64" ;;
            *) echo "不支持的架构：${ARCH}"; exit 1 ;;
          esac
          URL="https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-linux-${NODE_ARCH}.tar.xz"
          echo "下载 ${URL}"
          curl -fsSL --retry 3 --max-time 300 -o /tmp/node.tar.xz "${URL}"
          mkdir -p "${HOME}/node"
          tar xf /tmp/node.tar.xz -C "${HOME}/node" --strip-components=1
          echo "${HOME}/node/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/node/bin:${PATH}"
          echo "node: $(node -v)"

      - name: 记录环境
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 构建 fpk
        env:
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
          SKIP_BUNDLE: ${{ github.event.inputs.skip_bundle && '1' || '0' }}
        run: bash scripts/build.sh

      - name: 校验产物
        run: |
          set -euo pipefail
          test -f dist/hermes-desktop.fpk || { echo "缺少 fpk"; exit 1; }
          test -f dist/build-info.json || { echo "缺少 build-info"; exit 1; }
          ls -la dist/
          cat dist/build-info.json

      # 产物用统一命名格式，避免下载后与其它版本混淆
      - name: 规范化产物文件名
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['version'])")
          UPSTREAM=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")
          NEW="Hermes-Desktop-fnOS-v${VERSION}-${UPSTREAM}.fpk"
          cp "dist/hermes-desktop.fpk" "dist/${NEW}"
          rm -f "dist/hermes-desktop.fpk"
          echo "产物名：${NEW}"
          ls -la dist/

      # GitHub 已于 2025-01 停用 upload-artifact@v3，必须用 v4。
      # Gitea Actions 从 1.22 起也支持 v4，两边可统一。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fnos-hermes-desktop-fpk
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # 发布失败不应把「构建成功」也拖红 —— 产物已在上一步作为 artifact 上传。
      # 但「没有 Release 就没有下载」，所以失败时必须留下醒目的 error 注解，
      # 否则很容易出现「构建全绿但 Releases 页空空」的困惑。
      #
      # 注意：这里不再单独 git push tag。POST /releases 的 tag_name 若不存在，
      # GitHub/Gitea 都会自动从默认分支创建 tag —— 少一个动作就少一个 403 失败点。
      - name: 发布到 Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f dist/build-info.json ]; then
            echo "没有 build-info，跳过发布"
            exit 0
          fi

          VERSION=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['version'])")
          SHA=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")
          TAG="v${VERSION}"

          FPK_FILE=$(ls dist/Hermes-Desktop-fnOS-v*.fpk 2>/dev/null | head -1)
          [ -n "${FPK_FILE}" ] || { echo "::error::找不到规范化后的产物"; exit 1; }
          SHA256=$(sha256sum "${FPK_FILE}" | cut -d' ' -f1)
          SIZE=$(du -h "${FPK_FILE}" | cut -f1)
          {
            echo "Hermes 官方 Desktop 工作区的飞牛原生版。"
            echo
            echo "**下载**：本页 Assets 中的 \`$(basename "${FPK_FILE}")\`（${SIZE}）"
            echo
            echo "**安装**：飞牛桌面 → 应用中心 → 手动安装 → 选择该 fpk"
            echo
            echo "---"
            echo
            echo "上游仓库：NousResearch/hermes-agent  "
            echo "上游 commit：\`${SHA}\`"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${VERSION} |"
            echo "| SHA256 | \`${SHA256}\` |"
            echo "| 架构 | x86_64 |"
          } > release-notes.md

          # 仓库标识：Gitea 与 GitHub 都提供 GITHUB_REPOSITORY
          REPO_FULL="${GITHUB_REPOSITORY:-}"

          # 发布逻辑放在独立脚本里，避免 YAML 嵌套引号踩坑
          if ! python3 scripts/publish_release.py \
            --repo "${REPO_FULL}" \
            --tag "${TAG}" \
            --title "Hermes Desktop for fnOS ${VERSION}" \
            --notes-file release-notes.md \
            --assets "${FPK_FILE}" dist/build-info.json; then
            echo "::error::Release 发布失败（多半是 GITHUB_TOKEN 只有只读权限）。请到 Settings → Actions → General → Workflow permissions 选择 “Read and write permissions” 后重跑。"
            exit 1
          fi

          echo "RELEASE_URL=${GITHUB_SERVER_URL}/${REPO_FULL}/releases/tag/${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- ✅ Release：${GITHUB_SERVER_URL}/${REPO_FULL}/releases/tag/${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- 📦 产物：$(basename "${FPK_FILE}")（${SIZE}）" >> "${GITHUB_STEP_SUMMARY}"
