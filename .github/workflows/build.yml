name: 同步上游并构建

# 触发条件：
#   - schedule    每日同步上游并构建
#   - workflow_dispatch  手动触发（可指定上游 ref）
#   - push        打包脚本变更时立即验证构建
on:
  schedule:
    - cron: '17 3 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（分支或 tag，留空用 main）'
        required: false
        default: 'main'
      skip_bundle:
        description: '跳过渲染层构建（复用缓存）'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: fnos-hermes-desktop-build
  cancel-in-progress: false

jobs:
  build:
    name: 构建 fpk
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      # 直接下载 Node 26 二进制，不依赖 setup-node——
      # Gitea 的 action 源与 GitHub 不完全一致，且 Node 26 较新，
      # setup-node 的版本清单可能尚未收录。直接装最稳。
      - name: 安装 Node.js 26
        run: |
          set -euo pipefail
          NODE_VER="v26.13.0"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64)  NODE_ARCH="x64" ;;
            aarch64) NODE_ARCH="arm64" ;;
            *) echo "不支持的架构：${ARCH}"; exit 1 ;;
          esac
          URL="https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-linux-${NODE_ARCH}.tar.xz"
          echo "下载 ${URL}"
          curl -fsSL --retry 3 --max-time 300 -o /tmp/node.tar.xz "${URL}"
          mkdir -p "${HOME}/node"
          tar xf /tmp/node.tar.xz -C "${HOME}/node" --strip-components=1
          echo "${HOME}/node/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/node/bin:${PATH}"
          echo "node: $(node -v)"

      - name: 记录环境
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 构建 fpk
        env:
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
          SKIP_BUNDLE: ${{ github.event.inputs.skip_bundle && '1' || '0' }}
        run: bash scripts/build.sh

      - name: 校验产物
        run: |
          set -euo pipefail
          test -f dist/hermes-desktop.fpk || { echo "缺少 fpk"; exit 1; }
          test -f dist/build-info.json || { echo "缺少 build-info"; exit 1; }
          ls -la dist/
          cat dist/build-info.json

      # 产物用统一命名格式，避免下载后与其它版本混淆
      - name: 规范化产物文件名
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['version'])")
          UPSTREAM=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")
          NEW="Hermes-Desktop-fnOS-v${VERSION}-${UPSTREAM}.fpk"
          cp "dist/hermes-desktop.fpk" "dist/${NEW}"
          rm -f "dist/hermes-desktop.fpk"
          echo "产物名：${NEW}"
          ls -la dist/

      # GitHub 已于 2025-01 停用 upload-artifact@v3，必须用 v4。
      # Gitea Actions 从 1.22 起也支持 v4，两边可统一。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fnos-hermes-desktop-fpk
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f dist/build-info.json ]; then
            echo "没有 build-info，跳过发布"
            exit 0
          fi

          VERSION=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['version'])")
          SHA=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")
          TAG="v${VERSION}"

          FPK_FILE=$(ls dist/Hermes-Desktop-fnOS-v*.fpk 2>/dev/null | head -1)
          [ -n "${FPK_FILE}" ] || { echo "找不到规范化后的产物"; exit 1; }
          SHA256=$(sha256sum "${FPK_FILE}" | cut -d' ' -f1)
          {
            echo "Hermes 官方 Desktop 工作区的飞牛原生版。"
            echo
            echo "上游仓库：NousResearch/hermes-agent"
            echo "上游 commit：${SHA}"
            echo
            echo "安装方式：飞牛桌面 → 应用中心 → 手动安装 → 选择 hermes-desktop.fpk"
            echo
            echo "构建信息："
            echo "- 版本：${VERSION}"
            echo "- SHA256：${SHA256}"
          } > release-notes.md

          # 打 tag（已存在则复用）
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" -m "Hermes ${VERSION} (upstream ${SHA})"
            git push origin "refs/tags/${TAG}"
          fi

          # 仓库标识：Gitea 与 GitHub 都提供 GITHUB_REPOSITORY
          REPO_FULL="${GITHUB_REPOSITORY:-}"

          # 发布逻辑放在独立脚本里，避免 YAML 嵌套引号踩坑
          python3 scripts/publish_release.py \
            --repo "${REPO_FULL}" \
            --tag "${TAG}" \
            --title "Hermes Desktop for fnOS ${VERSION}" \
            --notes-file release-notes.md \
            --assets "${FPK_FILE}" dist/build-info.json
