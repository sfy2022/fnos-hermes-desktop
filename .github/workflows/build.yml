name: 上游发布后构建

# 版本策略：只有上游 NousResearch/hermes-agent 发布了新的 Release 才构建。
#   - sync.yml 定时检查最新 Release，发现新 tag 后 dispatch 本工作流；
#   - 本工作流按该 release tag 构建（不跟 main 分支），应用版本号在本地单调递增；
#   - 不再每日/每次打包改动都构建；打包改动由 test.yml 跑测试。
#   - workflow_dispatch 可手工指定上游 tag；force=true 可强制重建已记录过的版本。
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 release tag（留空 = 最新 Release）'
        required: false
        default: ''
      force:
        description: '强制重建（即使该 Release 已构建过）'
        type: boolean
        required: false
        default: false
      skip_bundle:
        description: '跳过渲染层构建（复用缓存）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fnos-hermes-desktop-build
  cancel-in-progress: false

jobs:
  check:
    name: 检查上游 Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      reason: ${{ steps.resolve.outputs.reason }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 解析上游 Release
        id: resolve
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.upstream_ref }}"
          if [ -z "${TAG}" ]; then
            TAG="$(curl -fsSL --max-time 30 \
              https://api.github.com/repos/NousResearch/hermes-agent/releases/latest \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("tag_name",""))')"
          fi
          case "${TAG}" in
            v[0-9]*) ;;
            *) echo "::error::无法解析上游 release tag: '${TAG}'"; exit 1 ;;
          esac
          VERSION="${TAG#v}"

          RECORDED="$(cat .upstream-release 2>/dev/null || true)"
          SHOULD="true"
          REASON=""
          if [ "${RECORDED}" = "${TAG}" ] && [ "${FORCE}" != "true" ]; then
            SHOULD="false"
            REASON="上游 ${TAG} 已构建过（.upstream-release）"
            echo "上游 ${TAG} 已构建过（.upstream-release），跳过。需要重建请勾选 force。"
          fi

          # 应用版本与上游 Release 完全一致；不再与本地旧 tag 比较。
          # 旧的 0.22.13~0.22.21 是本地验证包，不是 Release；正式版本从官方 Release 重新对齐。

          SHA="$(git ls-remote https://github.com/NousResearch/hermes-agent.git \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}" 2>/dev/null \
            | awk 'END {print $1}')"
          [ -n "${SHA}" ] || { echo "::error::取不到上游 tag ${TAG} 的 commit"; exit 1; }

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD}" >> "$GITHUB_OUTPUT"
          echo "- 上游 Release：**${TAG}**（${SHA}）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 本次构建：**${SHOULD}**" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 构建 fpk
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          ref: main
          # 需要完整历史与 tag：Release 说明要算「自上一版起有哪些提交」。
          fetch-depth: 0

      # 直接下载 Node 26 二进制，不依赖 setup-node。
      - name: 安装 Node.js 26
        run: |
          set -euo pipefail
          NODE_VER="v26.13.0"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64)  NODE_ARCH="x64" ;;
            aarch64) NODE_ARCH="arm64" ;;
            *) echo "不支持的架构：${ARCH}"; exit 1 ;;
          esac
          URL="https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-linux-${NODE_ARCH}.tar.xz"
          echo "下载 ${URL}"
          curl -fsSL --retry 3 --max-time 300 -o /tmp/node.tar.xz "${URL}"
          mkdir -p "${HOME}/node"
          tar xf /tmp/node.tar.xz -C "${HOME}/node" --strip-components=1
          echo "${HOME}/node/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/node/bin:${PATH}"
          echo "node: $(node -v)"

      - name: 记录环境
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "upstream tag: ${{ needs.check.outputs.tag }}"

      # 应用版本 = 上游 Release 版本（不再本地自增）。
      # 若上游版本低于本仓库已有 tag，check 会跳过构建，避免 fnOS 降级。
      - name: 应用版本跟随上游 Release
        run: |
          set -euo pipefail
          UP="${{ needs.check.outputs.version }}"
          case "${UP}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::无法解析上游版本: '${UP}'"; exit 1 ;;
          esac
          echo "APP_VERSION=${UP}" >> "${GITHUB_ENV}"
          echo "- 🏷 应用版本：**${UP}**（与上游 Release 完全一致）" >> "${GITHUB_STEP_SUMMARY}"

      - name: 构建 fpk
        env:
          UPSTREAM_REF: ${{ needs.check.outputs.tag }}
          SKIP_BUNDLE: ${{ inputs.skip_bundle && '1' || '0' }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: bash scripts/build.sh

      - name: 校验产物
        run: |
          set -euo pipefail
          test -f dist/hermes-desktop.fpk || { echo "缺少 fpk"; exit 1; }
          test -f dist/build-info.json || { echo "缺少 build-info"; exit 1; }
          ls -la dist/
          cat dist/build-info.json

      - name: 规范化产物文件名
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['version'])")
          UPSTREAM=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")
          NEW="Hermes-Desktop-fnOS-v${VERSION}-${UPSTREAM}.fpk"
          cp "dist/hermes-desktop.fpk" "dist/${NEW}"
          rm -f "dist/hermes-desktop.fpk"
          echo "产物名：${NEW}"
          ls -la dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fnos-hermes-desktop-fpk
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f dist/build-info.json ]; then
            echo "没有 build-info，跳过发布"
            exit 0
          fi

          VERSION=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['version'])")
          SHA=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")
          TAG="v${VERSION}"

          FPK_FILE=$(ls dist/Hermes-Desktop-fnOS-v*.fpk 2>/dev/null | head -1)
          [ -n "${FPK_FILE}" ] || { echo "::error::找不到规范化后的产物"; exit 1; }
          SHA256=$(sha256sum "${FPK_FILE}" | cut -d' ' -f1)
          SIZE=$(du -h "${FPK_FILE}" | cut -f1 | tr -d ' ')
          REPO_FULL="${GITHUB_REPOSITORY:-}"

          if ! python3 scripts/release_notes.py \
                --repo "${REPO_FULL}" \
                --api "${GITHUB_API_URL:-https://api.github.com}" \
                --token "${GH_TOKEN:-${GITEA_TOKEN}}" \
                --version "${VERSION}" \
                --sha "${SHA}" \
                --asset "$(basename "${FPK_FILE}")" \
                --size "${SIZE}" \
                --sha256 "${SHA256}" \
                --out release-notes.md; then
            echo "::warning::变更说明生成失败，退回简版说明"
            {
              echo "Hermes 官方 Desktop 工作区的飞牛原生版。"
              echo
              echo "**下载**：\`$(basename "${FPK_FILE}")\`（${SIZE}）"
              echo
              echo "**安装**：飞牛桌面 → 应用中心 → 手动安装 → 选择该 fpk"
              echo
              echo "上游 commit：\`${SHA}\` ｜ SHA256：\`${SHA256}\`"
            } > release-notes.md
          fi

          if ! python3 scripts/publish_release.py \
            --repo "${REPO_FULL}" \
            --tag "${TAG}" \
            --title "Hermes Desktop for fnOS ${VERSION}" \
            --notes-file release-notes.md \
            --assets "${FPK_FILE}" dist/build-info.json; then
            echo "::error::Release 发布失败（多半是 GITHUB_TOKEN 只有只读权限）。请到 Settings → Actions → General → Workflow permissions 选择 “Read and write permissions” 后重跑。"
            exit 1
          fi

          echo "RELEASE_URL=${GITHUB_SERVER_URL}/${REPO_FULL}/releases/tag/${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- ✅ Release：${GITHUB_SERVER_URL}/${REPO_FULL}/releases/tag/${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- 📦 产物：$(basename "${FPK_FILE}")（${SIZE}）" >> "${GITHUB_STEP_SUMMARY}"

      # 只有 Release 发布成功才记录已构建的上游 tag；失败则下次 sync 会重试。
      - name: 记录已构建的上游 Release
        if: steps.release.outcome == 'success'
        run: |
          set -euo pipefail
          TAG="${{ needs.check.outputs.tag }}"
          SHA=$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")
          echo "${TAG}" > .upstream-release
          echo "${SHA}" > .upstream-sha
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply.github.com"
          git add .upstream-release .upstream-sha
          git commit -m "chore: 记录已构建的上游 Release ${TAG}" || echo "无可提交变更"
          git push || echo "::warning::记录推送失败，下次 sync 可能重复构建"
